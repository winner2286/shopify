name: Tests and dependency security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, mbstring, curl, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --no-check-publish
      - run: composer audit --locked
      - run: php vendor/bin/phpunit --do-not-cache-result
      - run: node docs/audit-2026-11-17/verify-service-worker.mjs
      - run: node --test tests/ad-creative.test.cjs
      - run: for file in public/js/*.js resources/js/*.js; do node --check "$file"; done

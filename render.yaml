services:
  # Service Web Boutiq (Laravel 12 + PHP 8.4 + Nginx)
  - type: web
    name: boutiq-app
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Boutiq"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:rrVYcG6eKF+cstCcBCUpeK3uLfPYKda8hkkP16jMl5Y="
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: AUTO_MIGRATE
        value: "true"
      # Connexion automatique à la base PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: boutiq-db
          property: connectionString

# Base de données PostgreSQL infogérée Render (Tier Gratuit)
databases:
  - name: boutiq-db
    plan: free
    region: frankfurt
    databaseName: boutiq
    user: boutiq_user

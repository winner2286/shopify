services:
  # Service Web Zanika (Laravel 12 + PHP 8.4 + Nginx)
  - type: web
    name: boutiq-app
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Zanika"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:rrVYcG6eKF+cstCcBCUpeK3uLfPYKda8hkkP16jMl5Y="
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: AUTO_MIGRATE
        value: "true"
      # Connexion automatique à la base PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: boutiq-db
          property: connectionString
      # Relais Google Apps Script HTTPS (Port 443 - contourne le blocage Render Free)
      - key: GOOGLE_MAIL_WEBHOOK_URL
        value: "https://script.google.com/macros/s/AKfycbwGg02YFIw-1vnOZjCSGbybdZedMqp8JehT_AFRPdq1ifeAccVnO-Di6h3EibfHip6DRw/exec"
      - key: GOOGLE_MAIL_WEBHOOK_TOKEN
        value: "ZanikaSecureMailToken2026"
      - key: MAIL_MAILER
        value: google_webhook
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        value: kougnimag@gmail.com
      - key: MAIL_PASSWORD
        value: jnurlkvpnejaqhar
      - key: MAIL_FROM_ADDRESS
        value: kougnimag@gmail.com
      - key: MAIL_FROM_NAME
        value: "Zanika"
      # Passerelle de paiement FeexPay (Mobile Money & Carte Bancaire)
      - key: FEEXPAY_SHOP_ID
        value: "698dd650a7ffb88696f5id86"
      - key: FEEXPAY_TOKEN
        value: "test_Hg7Kjl3ZAM63UuIUpuudD9nKuu3ZAM67Kjl3Uuhn"
      - key: FEEXPAY_MODE
        value: "SANDBOX"
      - key: FEEXPAY_BASE_URL

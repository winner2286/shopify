        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:kougnimag@gmail.com"


# Base de données PostgreSQL infogérée Render (Tier Gratuit)
databases:
  - name: boutiq-db
    plan: free
    region: frankfurt
    databaseName: boutiq
    user: boutiq_user

        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_FALLBACK_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_VISION_MODEL
        value: "meta-llama/llama-4-scout-17b-16e-instruct"
      # IA Cascade de Secours (OpenRouter)

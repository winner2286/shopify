<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;position:absolute;inset:0;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0F17"/>
      <stop offset="45%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>

    <!-- Top Right Ambient Glow -->
    <linearGradient id="topGlow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF2D6D" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#800A2C" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#08090E" stop-opacity="0"/>
    </linearGradient>

    <!-- Central Radial Glow behind Emblem -->
    <radialGradient id="centerRadial" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FF2D6D" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#C2185B" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="#08090E" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Ruby Wave (Bottom/Right background layer) -->
    <linearGradient id="waveDark" x1="0.2" y1="1" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#1F000B" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#5E0622" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#8C0D36" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2B010F" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Main Satin Wave (Vibrant crimson glow) -->
    <linearGradient id="waveMain" x1="0.1" y1="1" x2="0.9" y2="0.3">
      <stop offset="0%" stop-color="#54041C" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#9E0D3C" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#E61958" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#FF2D6D" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#9E0D3C" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Foreground Highlight Ribbon Edge -->
    <linearGradient id="waveHighlight" x1="0.2" y1="1" x2="0.8" y2="0.2">
      <stop offset="0%" stop-color="#7A072B" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FF407B" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#FF6B98" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFA8C0" stop-opacity="1"/>
    </linearGradient>

    <!-- Soft Blur for realistic satin glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="deepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="430" height="932" fill="url(#bgBase)"/>

  <!-- Top Right Glow -->
  <rect width="430" height="932" fill="url(#topGlow)"/>

  <!-- Center Radial Glow -->
  <rect width="430" height="932" fill="url(#centerRadial)"/>

  <!-- Background Wave 1 (Deep ruby shadow layer) -->
  <path d="M 60 932 C 130 810, 200 730, 305 640 C 370 580, 410 510, 430 440 L 430 932 Z"
        fill="url(#waveDark)" filter="url(#deepBlur)" opacity="0.85"/>

  <!-- Main Wave 2 (Middle glowing ruby satin) -->
  <path d="M 90 932 C 150 820, 225 740, 315 660 C 375 600, 415 530, 430 460 L 430 932 Z"
        fill="url(#waveDark)"/>

  <!-- Main Wave 3 (Vibrant crimson foreground silk wave) -->
  <path d="M 125 932 C 185 825, 265 740, 355 650 C 395 605, 424 545, 430 490 L 430 932 Z"
        fill="url(#waveMain)" filter="url(#softGlow)"/>

  <!-- Edge Highlight Curve -->
  <path d="M 127 932 C 186 825, 266 740, 356 650 C 396 605, 425 545, 430 490"
        fill="none" stroke="url(#waveHighlight)" stroke-width="3.5" filter="url(#softGlow)"/>

  <!-- Secondary inner wave flow -->
  <path d="M 185 932 C 240 850, 310 780, 380 700 C 412 665, 426 620, 430 590 L 430 932 Z"
        fill="url(#waveMain)" opacity="0.6"/>
</svg>
